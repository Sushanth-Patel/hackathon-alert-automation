name: Hackathon Alert Automation Digest

on:
  schedule:
    # 7:30 AM IST = 02:00 UTC
    - cron: "0 2 * * *"
    # 6:30 PM IST = 13:00 UTC
    - cron: "0 13 * * *"
  workflow_dispatch:

concurrency:
  group: hackathon-digest
  cancel-in-progress: false

jobs:
  run-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache SQLite database (fallback mechanism)
        id: db-cache
        uses: actions/cache@v4
        with:
          path: hackathons.db
          key: hackathons-db-${{ github.run_id }}
          restore-keys: |
            hackathons-db-

      - name: Run Hackathon Alert Automation
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          python main.py

      - name: Commit and push updated database
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f hackathons.db ]; then
            git add hackathons.db
            if git diff --staged --quiet; then
              echo "No database changes to commit."
            else
              git commit -m "chore(db): update hackathons.db with sent records and cache [skip ci]"
              git push || echo "Push failed; database will be retained via actions/cache fallback."
            fi
          fi

      - name: Send failure alert to Telegram on error
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            ERROR_MSG="⚠️ <b>Hackathon Alert Workflow Failed</b>%0A%0AThe GitHub Actions scheduled digest run encountered an error.%0APlease check workflow logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}" \
              -d "text=${ERROR_MSG}" \
              -d "parse_mode=HTML" || true
          fi
