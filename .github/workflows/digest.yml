name: Hackathon Alert Automation Digest

on:
  schedule:
    # 8:00 AM IST = 02:30 UTC
    - cron: "30 2 * * *"
    # 6:00 PM IST = 12:30 UTC
    - cron: "30 12 * * *"
  workflow_dispatch:

concurrency:
  group: hackathon-digest
  cancel-in-progress: false

jobs:
  run-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache SQLite database (fallback mechanism)
        id: db-cache
        uses: actions/cache@v6
        with:
          path: hackathons.db
          key: hackathons-db-${{ github.run_id }}
          restore-keys: |
            hackathons-db-

      - name: Run Hackathon Alert Automation
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python main.py

      - name: Commit and push updated database
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f hackathons.db ]; then
            git add hackathons.db
            if git diff --staged --quiet; then
              echo "No database changes to commit."
            else
              git commit -m "chore(db): update hackathons.db with sent records and cache [skip ci]"
              git pull --rebase --autostash origin main || true
              git push || echo "Push failed; database will be retained via actions/cache fallback."
            fi
          fi

      - name: Send failure alert to Telegram on error
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            ERROR_MSG="⚠️ <b>Hackathon Alert Workflow Failed</b>%0A%0AThe GitHub Actions scheduled digest run encountered an error.%0APlease check workflow logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=${ERROR_MSG}" \
              --data-urlencode "parse_mode=HTML" || true
          fi
